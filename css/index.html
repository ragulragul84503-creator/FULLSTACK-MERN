<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cascading style sheet</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        .one{
            background-color: red;
        }
        #two{
            color: green;
            font-size: 20px;
            text-decoration: underline;
            font-weight: bold;
            font-family: "Times New Roman", serif;
        }
        .three{
            color: orange;
            text-decoration: none;
        }
        
    </style>
</head>
<body>
    <h1 class="one">heading</h1>
    <p id="two">lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas, voluptate</p>
    <a class="three"href="https://www.linkedin.com">LinkedIn</a>
</body>
</html>
